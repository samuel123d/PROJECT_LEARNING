<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - Firebase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">

  <div class="card text-center shadow p-3 position-absolute top-50 start-50 translate-middle" style="width: 25rem;">
    <div class="card-header fw-bold fs-4">
      Entrar
    </div>
    <div class="card-body">
      <div class="form-floating mb-3">
        <input type="email" class="form-control" id="email" placeholder="name@example.com" />
        <label for="email">Email</label>
      </div>

      <div class="form-floating mb-3">
        <input type="password" class="form-control" id="password" placeholder="Senha" />
        <label for="password">Senha</label>
      </div>

      <button id="loginBtn" class="btn btn-primary w-100 mb-2">Entrar</button>
      <button id="registerLink" class="btn btn-outline-success w-100">Criar conta</button>

      <div id="alertBox" class="mt-3" style="display:none;"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

    // ✅ SUA CONFIGURAÇÃO DO FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyDmmt1wbET6-dcvdsBGXW9j8Pm-S9N4kcs",
      authDomain: "lerning-project-4762d.firebaseapp.com",
      projectId: "lerning-project-4762d",
      storageBucket: "lerning-project-4762d.firebasestorage.app",
      messagingSenderId: "45818309485",
      appId: "1:45818309485:web:e5ef5b9532c6e7d2754864",
      measurementId: "G-6HR53JJSW4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginBtn = document.getElementById("loginBtn");
    const registerLink = document.getElementById("registerLink");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const alertBox = document.getElementById("alertBox");

    function showAlert(msg, type = "danger") {
      alertBox.style.display = "block";
      alertBox.innerHTML = `
        <div class="alert alert-${type} alert-dismissible fade show" role="alert">
          ${msg}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>`;
    }

    loginBtn.addEventListener("click", async () => {
      const mail = email.value.trim();
      const pass = password.value.trim();

      if (!mail || !pass) {
        showAlert("Preencha todos os campos!", "warning");
        return;
      }

      try {
        const userCredential = await signInWithEmailAndPassword(auth, mail, pass);
        const user = userCredential.user;
        showAlert(`Bem-vindo, ${user.displayName || "usuário"}!`, "success");
        setTimeout(() => window.location.href = "home.html", 1500);
      } catch (e) {
        showAlert("Erro ao entrar: " + e.message, "danger");
      }
    });

    registerLink.addEventListener("click", () => {
      window.location.href = "register.html";
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
